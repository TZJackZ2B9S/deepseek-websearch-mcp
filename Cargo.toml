[package]
name = "deepseek-websearch-mcp"
version = "0.1.0"
description = "A stdio MCP server that summarizes DeepSeek server-side web searches"
readme = "README.md"
repository = "https://github.com/TZJackZ2B9S/deepseek-websearch-mcp"
homepage = "https://github.com/TZJackZ2B9S/deepseek-websearch-mcp"
keywords = ["mcp", "deepseek", "web-search", "stdio"]
categories = ["command-line-utilities", "web-programming::http-client"]
license = "MIT"
edition = "2021"
rust-version = "1.88.0"

[[bin]]
name = "deepseek-websearch-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
